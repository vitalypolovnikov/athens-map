const m=map_602b3e032ea0b867c861696733b322fa;
const type=document.getElementById("market-type");
const day=document.getElementById("market-day");

const days={Monday:1,Tuesday:2,Wednesday:3,Thursday:4,Friday:5,Saturday:6};
const safe=s=>String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
// Hide all original 18 regular markers, which were approximate and never fully verified.
// Organic Folium markers and their popups are preserved unchanged.
for(const id of archivedLegacyIds){
  const marker=window["marker_"+id];
  if(marker&&m.hasLayer(marker))m.removeLayer(marker);
}
const nowAthens=()=>{
 const p=Object.fromEntries(new Intl.DateTimeFormat("en-GB",{
    timeZone:"Europe/Athens",year:"numeric",month:"2-digit",day:"2-digit"
 }).formatToParts(new Date()).filter(x=>x.type!=="literal").map(x=>[x.type,x.value]));
 return new Date(Date.UTC(+p.year,+p.month-1,+p.day,12));
};
function nextDateFor(weekday){
 const v=nowAthens();v.setUTCDate(v.getUTCDate()+(days[weekday]-v.getUTCDay()+7)%7);
 return v.toISOString().slice(0,10);
}
const markers=records.map(r=>{
 const displayDate=nextDateFor(r.weekday);
 const valid=( !r.start||r.start<=displayDate )&&( !r.end||r.end>=displayDate );
 const dates=r.start||r.end?("Published period: "+(r.start||"unspecified")+" – "+(r.end||"open-ended")):"Permanent in official register";
 const html="<strong>"+safe(r.area)+" — Regular ("+safe(r.weekday)+")</strong>"
   +"<br><strong>"+safe(r.street)+"</strong>"
   +"<br>General sale hours: 07:30–15:30 (exceptions possible)"
   +"<br>"+safe(dates)
   +"<br>Next "+safe(r.weekday)+": "+displayDate
   +"<br>Coordinates from operator's official map"
   +"<br><a target='_blank' rel='noopener noreferrer' href='"+safe(r.source)+"'>Official location and dates ↗</a>";
 const marker=L.circleMarker([r.lat,r.lon],{radius:6,color:"#174ea6",weight:1.5,fillColor:"#4385f5",fillOpacity:0.83})
  .bindPopup(html,{maxWidth:325});
 return {r,marker,valid};
});
function repaint(){
 let shown=0;
 for(const x of markers){
   // Re-evaluate validity whenever controls change: never display expired or not-yet-active sites.
   const date=nextDateFor(x.r.weekday);
   const valid=(!x.r.start||x.r.start<=date)&&(!x.r.end||x.r.end>=date);
   const show=valid&&(type.value==="all"||type.value==="regular")&&(day.value==="all"||day.value===x.r.weekday);
   if(show){if(!m.hasLayer(x.marker))x.marker.addTo(m);shown++;}
   else if(m.hasLayer(x.marker))m.removeLayer(x.marker);
 }
 const visibleBio=organicIds.filter(id=>{const v=window["marker_"+id];return v&&m.hasLayer(v);}).length;
 counter.textContent=(visibleBio+shown)+" visible ("+visibleBio+" Bio · "+shown+" Regular)";
}
type.addEventListener("change",repaint);
day.addEventListener("change",repaint);
document.getElementById("focus-kifisia").addEventListener("click",()=>{
 const k=window["marker_37c418631785bebb222eab0981187987"];
 if(!k)return;
 // Bring the favourite Bio market into view even from Regular/day-filter modes.
 type.value="bio";day.value="Monday";
 type.dispatchEvent(new Event("change"));
 day.dispatchEvent(new Event("change"));

 // Keep its popup below the filter panel on smaller screens.
 const popup=k.getPopup().getElement(), panel=document.getElementById("athens-tools");
 if(popup&&panel){
   const overlap=panel.getBoundingClientRect().bottom-popup.getBoundingClientRect().top;
   if(overlap>0)m.panBy([0,overlap+18],{animate:false});
 }
});
document.getElementById("show-closed").addEventListener("change",repaint);
repaint();
