name: Smoke-test Athens market map
on:
  push:
    branches:
      - revision/official-regular-market-inventory-2026-10-09
    paths:
      - index.html
      - tests/smoke_map.cjs
      - .github/workflows/map-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.58.0
          npx playwright install chromium
      - name: Verify market layer rendering and filters
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/athens-map-http.log 2>&1 &
          sleep 2
          node tests/smoke_map.cjs
