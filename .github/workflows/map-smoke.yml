name: Smoke-test Athens market map
on:
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - tests/smoke_map.cjs
      - tests/audit_kifisia.cjs
      - tests/visual_regression.cjs
      - tests/favorites.cjs
      - .github/workflows/map-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.58.0
          npx playwright install chromium
      - name: Verify market layer rendering and filters
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/athens-map-http.log 2>&1 &
          sleep 2
          node tests/smoke_map.cjs
          node tests/visual_regression.cjs
          node tests/audit_kifisia.cjs
          node tests/favorites.cjs
      - name: Archive visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athens-visual-qa
          path: qa-screenshots/*.jpg
          if-no-files-found: ignore
